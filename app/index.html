<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Chat</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7385; --line:#e2e5ec; --accent:#0a6ed1; --user:#e8f1fb; --err:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --panel:#1c2027; --text:#e8eaef; --muted:#9aa3b5; --line:#2b313c; --accent:#4c9aff; --user:#22384f; --err:#ff7b6b; }
  }
  * { box-sizing:border-box }
  html, body, #root { height:100%; margin:0 }
  body { font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text) }
  button { font:inherit; cursor:pointer }

  /* ---- login screen ---- */
  .login-wrap { height:100%; display:flex; align-items:center; justify-content:center }
  .login-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; width:300px }
  .login-card h1 { font-size:18px; margin:0 0 16px }
  .login-card input { width:100%; padding:9px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text) }
  .login-card button { width:100%; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px; margin-top:4px }
  .login-card button:disabled { opacity:.5 }
  .login-err { color:var(--err); font-size:13px; margin-top:8px }

  /* ---- app shell ---- */
  .shell { height:100%; display:flex; flex-direction:column }
  header.top { display:flex; align-items:center; gap:6px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel) }
  header.top .title { font-weight:600; margin-right:auto }
  .tab-btn { background:none; border:0; padding:8px 14px; border-radius:8px; color:var(--muted) }
  .tab-btn.active { background:var(--bg); color:var(--text); font-weight:600 }
  .who { color:var(--muted); font-size:13px; margin-right:8px }
  .logout { background:none; border:1px solid var(--line); border-radius:8px; padding:6px 12px; color:var(--text) }
  .body { flex:1; min-height:0; display:flex }

  /* ---- chat ---- */
  aside { width:260px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:12px }
  aside button.new { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px }
  ul.sessions { list-style:none; margin:12px 0 0; padding:0; overflow:auto; flex:1 }
  ul.sessions li { display:flex; align-items:center; gap:6px; padding:8px; border-radius:8px; cursor:pointer }
  ul.sessions li:hover, ul.sessions li.active { background:var(--bg) }
  ul.sessions li span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  ul.sessions li button { background:none; border:0; color:var(--muted); font-size:18px }
  main.chat { flex:1; display:flex; flex-direction:column; min-width:0 }
  #messages { flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:12px }
  .msg { max-width:760px; padding:10px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--line); white-space:pre-wrap }
  .msg.human { align-self:flex-end; background:var(--user); border-color:transparent }
  .msg.err { color:var(--err) }
  .src { margin-top:8px; font-size:12px; color:var(--muted) }
  form.composer { display:flex; gap:8px; padding:12px 20px; border-top:1px solid var(--line); background:var(--panel) }
  textarea { flex:1; resize:none; border:1px solid var(--line); border-radius:8px; padding:9px; font:inherit; background:var(--bg); color:var(--text) }
  form.composer button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px }
  form.composer button:disabled { opacity:.5 }
  @media (max-width:700px) { aside { display:none } }

  /* ---- admin ---- */
  .admin-wrap { flex:1; overflow:auto; padding:24px }
  .admin-inner { max-width:860px; margin:0 auto }
  section.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:18px }
  section.card h2 { font-size:16px; margin:0 0 12px }
  label.field { display:inline-block; margin-right:14px; font-size:13px; color:var(--muted) }
  input[type=number] { width:90px; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text) }
  .upload-btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 16px }
  .upload-btn:disabled { opacity:.5 }
  .status-line { margin-top:12px; font-size:14px; color:var(--muted) }
  table { width:100%; border-collapse:collapse; font-size:14px }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line) }
  th { color:var(--muted); font-weight:500 }
  .del { background:none; color:var(--err); padding:2px 8px; border:0 }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const CHAT_API = '/odata/v4/chat/';
const ADMIN_API = '/odata/v4/admin/';

// ---------- shared fetch helper: sends Basic Auth manually so the browser ----------
// ---------- never pops its own native login dialog on a 401.              ----------
function useApi(auth) {
  return async function api(base, path, body) {
    const headers = { 'Authorization': 'Basic ' + btoa(auth.username + ':' + auth.password) };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    const res = await fetch(base + path, body === undefined ? { headers } : {
      method: 'POST', headers, body: JSON.stringify(body)
    });
    if (!res.ok) {
      let m = res.statusText;
      try { m = (await res.json()).error.message; } catch {}
      if (res.status === 401) throw new Error('Session expired, please log in again.');
      if (res.status === 403) throw new Error('Forbidden: you need the Admin role');
      throw new Error(m);
    }
    return res.json();
  };
}

// ---------------------------- Login ----------------------------
function Login({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    if (!username || !password) return;
    setBusy(true); setErr('');
    const headers = { 'Authorization': 'Basic ' + btoa(username + ':' + password) };
    try {
      // Any authenticated GET works to validate credentials; chat service is open to all logged-in users.
      const res = await fetch(CHAT_API + 'mySessions()', { headers });
      if (res.status === 401) throw new Error('Wrong username or password.');
      if (!res.ok) throw new Error(res.statusText);

      // Determine role by probing the admin-only service.
      let isAdmin = false;
      const adminRes = await fetch(ADMIN_API + 'Documents?$top=1', { headers });
      if (adminRes.ok) isAdmin = true;
      else if (adminRes.status !== 403) throw new Error(adminRes.statusText);

      onLogin({ username, password, isAdmin });
    } catch (e2) {
      setErr(e2.message);
    }
    setBusy(false);
  }

  return (
    <div className="login-wrap">
      <form className="login-card" onSubmit={submit}>
        <h1>Document Chat</h1>
        <input placeholder="Username" value={username} autoFocus
               onChange={e => setUsername(e.target.value)} />
        <input placeholder="Password" type="password" value={password}
               onChange={e => setPassword(e.target.value)} />
        <button disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</button>
        {err && <div className="login-err">{err}</div>}
      </form>
    </div>
  );
}

// ---------------------------- Chat tab ----------------------------
function Chat({ api }) {
  const [sessions, setSessions] = useState([]);
  const [sessionId, setSessionId] = useState(null);
  const [messages, setMessages] = useState([{ role: 'ai', text: 'Hi! Ask me anything about the uploaded documents.' }]);
  const [q, setQ] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const bottomRef = useRef(null);

  useEffect(() => { loadSessions(); }, []);
  useEffect(() => { bottomRef.current?.scrollIntoView({ block: 'end' }); }, [messages]);

  async function loadSessions() {
    try {
      const { value } = await api(CHAT_API, 'mySessions()');
      setSessions(value);
    } catch (e) { setErr(e.message); }
  }

  function newChat() {
    setSessionId(null);
    setMessages([{ role: 'ai', text: 'Hi! Ask me anything about the uploaded documents.' }]);
    loadSessions();
  }

  async function openSession(id) {
    try {
      setSessionId(id);
      const { value } = await api(CHAT_API, `sessionMessages(sessionId=${id})`);
      setMessages(value.map(m => ({ role: m.role, text: m.content })));
    } catch (e) { setErr(e.message); }
  }

  async function deleteSession(id, ev) {
    ev.stopPropagation();
    if (!confirm('Delete this chat?')) return;
    await api(CHAT_API, 'deleteSession', { sessionId: id });
    if (id === sessionId) newChat(); else loadSessions();
  }

  function citedSources(answer, sources) {
    const pages = [...answer.matchAll(/page\s*(\d+)/gi)].map(m => +m[1]);
    return sources.filter(s => pages.includes(s.page));
  }

  async function send(e) {
    e.preventDefault();
    const text = q.trim();
    if (!text || busy) return;
    setBusy(true); setQ(''); setErr('');
    setMessages(m => [...m, { role: 'human', text }, { role: 'ai', text: 'Thinking…', pending: true }]);
    try {
      const r = await api(CHAT_API, 'chat', { question: text, ...(sessionId && { sessionId }) });
      setSessionId(r.sessionId);
      setMessages(m => [...m.slice(0, -1), { role: 'ai', text: r.answer, sources: citedSources(r.answer, r.sources) }]);
      loadSessions();
    } catch (e2) {
      setMessages(m => [...m.slice(0, -1), { role: 'err', text: e2.message }]);
    }
    setBusy(false);
  }

  function md(s) {
    const esc = s.replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
    return esc.replace(/^\s*[*-] /gm, '• ').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  return (
    <div className="body">
      <aside>
        <button className="new" onClick={newChat}>+ New chat</button>
        <ul className="sessions">
          {sessions.map(s => (
            <li key={s.ID} className={s.ID === sessionId ? 'active' : ''} onClick={() => openSession(s.ID)}>
              <span>{s.title || 'Untitled'}</span>
              <button title="Delete chat" onClick={e => deleteSession(s.ID, e)}>×</button>
            </li>
          ))}
        </ul>
      </aside>
      <main className="chat">
        <div id="messages">
          {messages.map((m, i) => (
            <div key={i} className={'msg ' + m.role}>
              {m.role === 'ai' ? <span dangerouslySetInnerHTML={{ __html: md(m.text) }} /> : m.text}
              {m.sources && m.sources.length > 0 &&
                <div className="src">Sources: {m.sources.map(x => `${x.filename}, page ${x.page}`).join(' · ')}</div>}
            </div>
          ))}
          {err && <div className="msg err">{err}</div>}
          <div ref={bottomRef} />
        </div>
        <form className="composer" onSubmit={send}>
          <textarea rows="2" value={q} placeholder="Ask about your documents…  (Enter to send, Shift+Enter for a new line)"
            onChange={e => setQ(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(e); } }} />
          <button disabled={busy}>Send</button>
        </form>
      </main>
    </div>
  );
}

// ---------------------------- Admin tab ----------------------------
function Admin({ api }) {
  const [docs, setDocs] = useState([]);
  const [file, setFile] = useState(null);
  const [size, setSize] = useState(1000);
  const [overlap, setOverlap] = useState(200);
  const [status, setStatus] = useState('');
  const [busy, setBusy] = useState(false);

  useEffect(() => { load(); }, []);

  async function load() {
    try {
      const { value } = await api(ADMIN_API, 'Documents?$select=ID,filename,status,uploadedBy,createdAt&$orderby=createdAt desc');
      setDocs(value);
    } catch (e) { setStatus(e.message); }
  }

  async function upload() {
    if (!file) return setStatus('Choose a PDF first.');
    if (file.size > 14 * 1024 * 1024) return setStatus('File too large (max about 14 MB).');
    if (docs.some(d => d.filename === file.name) && !confirm(`${file.name} is already indexed. Upload it again anyway?`)) return;

    setBusy(true); setStatus('Reading file…');
    try {
      const b64 = await new Promise((ok, no) => {
        const r = new FileReader();
        r.onload = () => ok(r.result.split(',')[1]);
        r.onerror = no;
        r.readAsDataURL(file);
      });
      setStatus('Chunking and embedding… this can take up to a minute.');
      const r = await api(ADMIN_API, 'uploadDocument', {
        filename: file.name, fileBase64: b64, chunkSize: +size, chunkOverlap: +overlap
      });
      setStatus(`Done: ${r.chunkCount} chunks stored.`);
      load();
    } catch (e) { setStatus('Failed: ' + e.message); }
    setBusy(false);
  }

  async function del(d) {
    if (!confirm(`Delete ${d.filename} and all its chunks?`)) return;
    try { await api(ADMIN_API, 'deleteDocument', { documentId: d.ID }); load(); }
    catch (e) { setStatus(e.message); }
  }

  return (
    <div className="admin-wrap">
      <div className="admin-inner">
        <section className="card">
          <h2>Upload a PDF</h2>
          <p><input type="file" accept="application/pdf" onChange={e => setFile(e.target.files[0] || null)} /></p>
          <p>
            <label className="field">Chunk size
              <input type="number" value={size} min="200" max="4000" onChange={e => setSize(e.target.value)} />
            </label>
            <label className="field">Overlap
              <input type="number" value={overlap} min="0" max="1000" onChange={e => setOverlap(e.target.value)} />
            </label>
          </p>
          <button className="upload-btn" disabled={busy} onClick={upload}>Upload and index</button>
          <div className="status-line">{status}</div>
        </section>

        <section className="card">
          <h2>Indexed documents</h2>
          <table>
            <thead><tr><th>File</th><th>Status</th><th>Uploaded by</th><th>Date</th><th></th></tr></thead>
            <tbody>
              {docs.length === 0 && <tr><td colSpan="5">No documents yet.</td></tr>}
              {docs.map(d => (
                <tr key={d.ID}>
                  <td>{d.filename}</td>
                  <td>{d.status}</td>
                  <td>{d.uploadedBy}</td>
                  <td>{new Date(d.createdAt).toLocaleString()}</td>
                  <td><button className="del" onClick={() => del(d)}>Delete</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </section>
      </div>
    </div>
  );
}

// ---------------------------- App shell ----------------------------
function App() {
  const [auth, setAuth] = useState(null); // { username, password, isAdmin }
  const [tab, setTab] = useState('chat');
  const api = useApi(auth || {});

  if (!auth) return <Login onLogin={setAuth} />;

  return (
    <div className="shell">
      <header className="top">
        <div className="title">Document Chat</div>
        <button className={'tab-btn ' + (tab === 'chat' ? 'active' : '')} onClick={() => setTab('chat')}>Chat</button>
        {auth.isAdmin &&
          <button className={'tab-btn ' + (tab === 'admin' ? 'active' : '')} onClick={() => setTab('admin')}>Admin</button>}
        <span className="who">{auth.username}{auth.isAdmin ? ' · admin' : ''}</span>
        <button className="logout" onClick={() => setAuth(null)}>Log out</button>
      </header>
      {tab === 'chat' ? <Chat api={api} /> : <Admin api={api} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
