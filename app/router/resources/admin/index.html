<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document Admin</title>
    <style>
      :root {
        --bg: #f5f6f8;
        --panel: #fff;
        --text: #1a2030;
        --muted: #6a7386;
        --line: #e3e6ec;
        --accent: #0a6ed1;
        --acc2: #0857a6;
        --soft: #eaf2fb;
        --err: #c0392b;
        --ok: #1e8e4e;
        --warn: #b26a00;
        --sh:
          0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 16px rgba(16, 24, 40, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151a;
          --panel: #1a1e25;
          --text: #e8eaef;
          --muted: #98a1b3;
          --line: #2a303b;
          --accent: #4c9aff;
          --acc2: #79b3ff;
          --soft: #212b3a;
          --err: #ff7b6b;
          --ok: #4cc38a;
          --warn: #f0b04a;
          --sh: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-weight: 650;
        font-size: 16px;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      .brand i {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), var(--acc2));
      }
      .sp {
        flex: 1;
      }
      .who {
        font-size: 13px;
        color: var(--muted);
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        border-radius: 9px;
        padding: 6px 12px;
        font-size: 13px;
        text-decoration: none;
        transition: 0.15s;
      }
      .btn:hover {
        background: var(--bg);
        border-color: var(--accent);
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
        padding: 26px 18px;
        display: grid;
        gap: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--sh);
        padding: 20px;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 14px;
      }
      .drop {
        display: block;
        border: 2px dashed var(--line);
        border-radius: 12px;
        padding: 30px 16px;
        text-align: center;
        color: var(--muted);
        cursor: pointer;
        transition: 0.15s;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent);
      }
      .drop b {
        display: block;
        color: var(--text);
        margin-bottom: 2px;
      }
      .drop input {
        display: none;
      }
      details {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      summary {
        cursor: pointer;
      }
      .fields {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      label.f {
        display: grid;
        gap: 4px;
      }
      input[type="number"] {
        width: 120px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      .go {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .primary {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        font-weight: 550;
        transition: 0.15s;
      }
      .primary:hover {
        background: var(--acc2);
      }
      .primary:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .bar {
        height: 4px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
        margin-top: 14px;
        display: none;
      }
      .bar.on {
        display: block;
      }
      .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 35%;
        background: var(--accent);
        border-radius: 4px;
        animation: sl 1.1s infinite ease-in-out;
      }
      @keyframes sl {
        0% {
          margin-left: -35%;
        }
        100% {
          margin-left: 100%;
        }
      }
      #status {
        font-size: 13.5px;
        color: var(--muted);
      }
      #status.err {
        color: var(--err);
      }
      #status.ok {
        color: var(--ok);
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      td:first-child {
        white-space: normal;
        word-break: break-word;
        font-weight: 550;
      }
      tr:last-child td {
        border: 0;
      }
      tbody tr {
        transition: background 0.15s;
      }
      tbody tr:hover {
        background: var(--bg);
      }
      .badge {
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--soft);
        color: var(--accent);
      }
      .badge.ready {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 14%, transparent);
      }
      .badge.failed {
        color: var(--err);
        background: color-mix(in srgb, var(--err) 14%, transparent);
      }
      .del {
        background: none;
        border: 0;
        color: var(--muted);
        padding: 4px 10px;
        border-radius: 8px;
      }
      .del:hover {
        color: var(--err);
        background: color-mix(in srgb, var(--err) 10%, transparent);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 26px 0;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        color: var(--text);
        padding: 22px;
        max-width: 380px;
        box-shadow: var(--sh);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      dialog p {
        margin: 0 0 18px;
      }
      .acts {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .danger {
        background: var(--err);
      }
      .danger:hover {
        background: var(--err);
        opacity: 0.9;
      }
      #toast {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translate(-50%, 20px);
        background: var(--text);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img
          height="24px"
          class="logo"
          src="ai.png"
          alt="Document Upload"
        />Document Admin
      </div>
      <span class="sp"></span>
      <span class="who" id="who"></span>
      <a class="btn" href="../chat/index.html">Back to chat</a>
      <a class="btn" href="/do/logout">Sign out</a>
    </header>
    <div class="wrap">
      <section class="card">
        <h2>Upload a document</h2>
        <label class="drop" id="drop" tabindex="0"
          ><input type="file" id="file" accept="application/pdf" /><b id="fname"
            >Drop a PDF here or click to browse</b
          ><span id="fhint">Text-based PDF, up to 14 MB</span></label
        >
        <details>
          <summary>Advanced: chunk settings</summary>
          <div class="fields">
            <label class="f"
              >Chunk size<input
                type="number"
                id="size"
                value="1000"
                min="200"
                max="4000"
            /></label>
            <label class="f"
              >Overlap<input
                type="number"
                id="overlap"
                value="200"
                min="0"
                max="1000"
            /></label>
          </div>
        </details>
        <div class="go">
          <button class="primary" id="upload" disabled>Upload and index</button
          ><span id="status" role="status"></span>
        </div>
        <div class="bar" id="bar"></div>
      </section>
      <section class="card">
        <h2>
          Indexed documents
          <span id="count" style="color: var(--muted); font-weight: 400"></span>
        </h2>
        <div class="tw">
          <table>
            <thead>
              <tr>
                <th>File</th>
                <th>Status</th>
                <th>Uploaded by</th>
                <th>Date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="docs"></tbody>
          </table>
        </div>
      </section>
    </div>
    <dialog id="dlg">
      <p id="dmsg"></p>
      <div class="acts">
        <button class="btn" id="dno">Cancel</button
        ><button class="primary danger" id="dyes">Confirm</button>
      </div>
    </dialog>
    <div id="toast"></div>
    <script>
      const API = "/odata/v4/admin/",
        $ = (id) => document.getElementById(id);
      let names = [],
        file = null;
      async function api(p, b, base = API) {
        const r = await fetch(
          base + p,
          b === undefined
            ? {}
            : {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(b),
              },
        );
        if (!r.ok) {
          let m = r.statusText;
          try {
            m = (await r.json()).error.message;
          } catch {}
          throw new Error(
            r.status === 403 ? "Forbidden: you need the Admin role" : m,
          );
        }
        return r.json();
      }
      const say = (t, c = "") => {
        $("status").textContent = t;
        $("status").className = c;
      };
      const toast = (t) => {
        const e = $("toast");
        e.textContent = t;
        e.classList.add("on");
        setTimeout(() => e.classList.remove("on"), 2600);
      };
      const ask = (msg, label = "Confirm") =>
        new Promise((ok) => {
          $("dmsg").textContent = msg;
          $("dyes").textContent = label;
          $("dlg").showModal();
          $("dyes").onclick = () => {
            $("dlg").close();
            ok(true);
          };
          $("dno").onclick = () => {
            $("dlg").close();
            ok(false);
          };
          $("dlg").oncancel = () => ok(false);
        });
      async function load() {
        try {
          const { value } = await api(
            "Documents?$select=ID,filename,status,uploadedBy,createdAt&$orderby=createdAt desc",
          );
          names = value.map((d) => d.filename);
          $("count").textContent = value.length ? "(" + value.length + ")" : "";
          const tb = $("docs");
          tb.innerHTML = "";
          if (!value.length) {
            tb.innerHTML =
              '<tr><td colspan="5" class="empty">No documents yet. Upload a PDF to get started.</td></tr>';
            return;
          }
          for (const d of value) {
            const tr = document.createElement("tr");
            const c = (t) => {
              const td = document.createElement("td");
              td.textContent = t;
              tr.append(td);
              return td;
            };
            c(d.filename);
            const b = document.createElement("span");
            b.className = "badge " + d.status;
            b.textContent = d.status;
            c("").append(b);
            c(d.uploadedBy);
            c(
              new Date(d.createdAt).toLocaleString([], {
                dateStyle: "medium",
                timeStyle: "short",
              }),
            );
            const x = document.createElement("button");
            x.className = "del";
            x.textContent = "Delete";
            x.onclick = async () => {
              if (
                !(await ask(
                  'Delete "' +
                    d.filename +
                    '" and all its chunks? This cannot be undone.',
                  "Delete",
                ))
              )
                return;
              try {
                await api("deleteDocument", { documentId: d.ID });
                toast("Document deleted");
                load();
              } catch (e) {
                say(e.message, "err");
              }
            };
            c("").append(x);
            tb.append(tr);
          }
        } catch (e) {
          say(e.message, "err");
        }
      }
      function pick(f) {
        if (!f) return;
        if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name))
          return say("Please choose a PDF file.", "err");
        if (f.size > 14 * 1024 * 1024)
          return say("File too large (max about 14 MB).", "err");
        file = f;
        $("fname").textContent = f.name;
        $("fhint").textContent = (f.size / 1048576).toFixed(1) + " MB";
        $("upload").disabled = false;
        say("");
      }
      $("file").onchange = (e) => pick(e.target.files[0]);
      const dz = $("drop");
      ["dragenter", "dragover"].forEach((t) =>
        dz.addEventListener(t, (e) => {
          e.preventDefault();
          dz.classList.add("over");
        }),
      );
      ["dragleave", "drop"].forEach((t) =>
        dz.addEventListener(t, (e) => {
          e.preventDefault();
          dz.classList.remove("over");
        }),
      );
      dz.addEventListener("drop", (e) => pick(e.dataTransfer.files[0]));
      dz.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          $("file").click();
        }
      });
      $("upload").onclick = async () => {
        if (!file) return;
        if (
          names.includes(file.name) &&
          !(await ask(
            file.name + " is already indexed. Upload it again anyway?",
            "Upload again",
          ))
        )
          return;
        $("upload").disabled = true;
        $("bar").classList.add("on");
        say("Reading file\u2026");
        try {
          const b64 = await new Promise((ok, no) => {
            const r = new FileReader();
            r.onload = () => ok(r.result.split(",")[1]);
            r.onerror = no;
            r.readAsDataURL(file);
          });
          say("Chunking and embedding. This can take up to a minute\u2026");
          const r = await api("uploadDocument", {
            filename: file.name,
            fileBase64: b64,
            chunkSize: +$("size").value,
            chunkOverlap: +$("overlap").value,
          });
          say("Done: " + r.chunkCount + " chunks stored.", "ok");
          toast("Document indexed");
          file = null;
          $("file").value = "";
          $("fname").textContent = "Drop a PDF here or click to browse";
          $("fhint").textContent = "Text-based PDF, up to 14 MB";
          load();
        } catch (e) {
          say("Failed: " + e.message, "err");
          $("upload").disabled = false;
        }
        $("bar").classList.remove("on");
      };
      api("me()", undefined, "/odata/v4/chat/")
        .then((r) => ($("who").textContent = r.id))
        .catch(() => {});
      load();
    </script>
  </body>
</html>
